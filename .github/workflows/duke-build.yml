name: Duke APK Build
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/duke-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK packages the build needs
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1); fi
          echo "sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build the Duke APK (debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duke_APK_V4
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
